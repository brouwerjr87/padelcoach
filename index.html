level":2},{"techniek":"dubbele-wand","level":1}],"uitvoering":["Twee spelers aan het net spelen alleen diepe ballen.","De twee achterin spelen elke bal pas na de wand terug.","Wissel na 5 minuten van rol."],"focus":"Controle voor kracht: diep of lob.","klaarAls":"10 ballen achter elkaar in het spel"},{"id":"volley-muur","naam":"Volleys tegen de muur","spelers":"solo","duurMin":10,"benodigdheden":["vlakke muur buiten de baan","ballen"],"technieken":[{"techniek":"volley","level":1},{"techniek":"volley","level":2}],"uitvoering":["Ga op 2 tot 3 meter van een muur staan.","Speel de bal steeds zonder stuit terug tegen de muur.","Wissel na 10 keer van forehand naar backhand."],"focus":"Geen zwaai: draai je schouders en duw.","klaarAls":"20 volleys achter elkaar"},{"id":"volley-aangooi","naam":"Volley op aangooi","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"volley","level":1},{"techniek":"volley","level":2},{"techniek":"volley","level":3}],"uitvoering":["Je partner staat bij de achterlijn en gooit of speelt de bal naar je toe.","Jij staat aan het net en volleyt de bal terug naar je partner.","Eerst forehand, dan backhand, dan door elkaar."],"focus":"Instappen met de voorste voet.","klaarAls":"8 van 10 terug binnen bereik van je partner"},{"id":"volley-volley","naam":"Volley-volley","spelers":"duo","duurMin":10,"benodigdheden":["ballen"],"technieken":[{"techniek":"volley","level":1},{"techniek":"volley","level":2}],"uitvoering":["Jullie staan allebei aan het net, aan weerszijden.","Speel de bal met volleys heen en weer, zonder dat hij stuit.","Rustig tempo: het gaat om controle."],"focus":"Racket hoog voor je borst.","klaarAls":"20 volleys achter elkaar samen"},{"id":"lage-volley-blok","naam":"Lage volleys","spelers":"duo","duurMin":10,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"volley","level":3}],"uitvoering":["Je partner gooit lage ballen naar je voeten.","Jij zakt door je knieën en speelt de bal met een open blad diep terug.","Daarna roept je partner vlak voor het raken \\"diep\\" of \\"lob\\", en jij speelt die keuze."],"focus":"Door de knieën, rug recht.","klaarAls":"7 van 10 diep terug"},{"id":"bandeja-schaduw","naam":"Schaduw-bandeja","spelers":"solo","duurMin":5,"benodigdheden":[],"technieken":[{"techniek":"bandeja","level":1}],"uitvoering":["Start aan het net.","Draai zijwaarts, wijs met je vrije hand omhoog en loop met zijpassen naar achter.","Maak een bandeja zonder bal en loop terug naar het net."],"focus":"Zijpassen en uitzwaai opzij.","klaarAls":"10 keer de hele beweging vloeiend"},{"id":"bandeja-aangooi","naam":"Bandeja op lob","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"bandeja","level":1},{"techniek":"bandeja","level":2}],"uitvoering":["Je partner staat achterin en speelt lobs.","Jij staat aan het net, speelt een bandeja en loopt terug naar het net.","Na 10 ballen wisselen."],"focus":"Bal voor je raken, niet boven je hoofd.","klaarAls":"7 van 10 diep terug en weer aan het net"},{"id":"net-tegen-achter","naam":"Net tegen achter","spelers":"kwartet","duurMin":20,"benodigdheden":["ballen"],"technieken":[{"techniek":"volley","level":1},{"techniek":"volley","level":2},{"techniek":"bandeja","level":1},{"techniek":"bandeja","level":2}],"uitvoering":["Twee spelers aan het net, twee achterin.","De twee achterin spelen alleen lobs en lage ballen; de twee aan het net volleyen en spelen bandeja.","Punten tellen pas na drie slagen. Wissel na 5 minuten."],"focus":"Het net houden: na elke bandeja terug.","klaarAls":"Netduo wint een game zonder het net te verliezen"},{"id":"lob-zelf","naam":"Lob op doel","spelers":"solo","duurMin":10,"benodigdheden":["emmer ballen","pionnen"],"technieken":[{"techniek":"lob","level":1},{"techniek":"lob","level":2}],"uitvoering":["Leg met pionnen een vak neer in de laatste 2 meter voor de verre achterwand.","Laat de bal naast je stuiten en speel hem met een lob naar het vak.","Wissel na 10 ballen van forehand naar backhand."],"focus":"Blad open, hoog uitzwaaien.","klaarAls":"6 van 10 in het vak"},{"id":"lob-aangooi","naam":"Lob over de netspeler","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"lob","level":1},{"techniek":"lob","level":2}],"uitvoering":["Je partner staat aan het net en speelt de bal naar je toe.","Jij speelt een lob over hem heen.","Haalt hij de bal met een uitgestrekte arm, dan was de lob te laag."],"focus":"Hoog genoeg dat je partner er niet bij kan.","klaarAls":"7 van 10 over je partner en diep"},{"id":"lob-tegen-net","naam":"Lobben tot het net","spelers":"kwartet","duurMin":20,"benodigdheden":["ballen"],"technieken":[{"techniek":"lob","level":1},{"techniek":"lob","level":2},{"techniek":"lob","level":3},{"techniek":"bajada","level":1}],"uitvoering":["Twee spelers aan het net, twee achterin.","Het duo achterin probeert met lobs het net te veroveren.","Lukt dat, dan wisselen jullie van rol."],"focus":"Na een goede lob samen naar voren.","klaarAls":"Drie keer het net veroverd"},{"id":"lob-na-wand","naam":"Lob na de wand","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"lob","level":3}],"uitvoering":["Je partner speelt de bal diep, zodat hij via de achterwand komt.","Jij laat de bal komen en speelt een hoge lob terug."],"focus":"Wachten tot de bal zakt.","klaarAls":"6 van 10 diepe lobs"},{"id":"bajada-schaduw","naam":"Schaduw-bajada","spelers":"solo","duurMin":5,"benodigdheden":[],"technieken":[{"techniek":"bajada","level":1}],"uitvoering":["Start achterin, een meter of twee van de achterwand.","Draai zijwaarts, racket hoog, loop met zijpassen naar achter en weer naar voren.","Sla de bajada zonder bal en loop door naar het net."],"focus":"Met de bal mee naar voren bewegen.","klaarAls":"10 keer de hele beweging vloeiend"},{"id":"bajada-aangooi","naam":"Bajada op aangooi","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"bajada","level":1}],"uitvoering":["Je partner gooit of speelt de bal hoog en diep, zodat hij hoog tegen de achterwand komt.","Jij speelt de bal na de wand met een bajada terug.","Daarna loop je door naar het net en terug."],"focus":"Ruim van het glas blijven.","klaarAls":"6 van 10 diep terug"},{"id":"service-doel","naam":"Serveren op doel","spelers":"solo","duurMin":10,"benodigdheden":["emmer ballen","pionnen"],"technieken":[{"techniek":"service","level":1},{"techniek":"service","level":2}],"uitvoering":["Zet een pion in de glazen hoek en een op de T van het servicevak aan de overkant.","Serveer 10 ballen naar de hoek en 10 naar de T.","Daarna van de andere kant."],"focus":"Raakpunt onder je middel, rustige zwaai.","klaarAls":"6 van 10 dicht bij de pion"},{"id":"service-net","naam":"Serveren en naar het net","spelers":"duo","duurMin":15,"benodigdheden":["ballen"],"technieken":[{"techniek":"service","level":1}],"uitvoering":["Jij serveert, je partner retourneert rustig.","Na je service loop je naar het net en maak je een split-step op de return.","Speel de eerste volley terug en begin opnieuw."],"focus":"Split-step op het moment van de return.","klaarAls":"8 keer op tijd aan het net"},{"id":"return-aangooi","naam":"Return-training","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"return","level":1},{"techniek":"return","level":2}],"uitvoering":["Je partner serveert, jij retourneert.","Eerst 10 returns: alles terug in het spel, liefst laag cross.","Dan 10 lobs over de netspeler.","Wissel daarna van rol."],"focus":"Compacte voorbereiding.","klaarAls":"8 van 10 terug, daarna 6 van 10 lobs diep"},{"id":"service-return-spel","naam":"Servicegames","spelers":"kwartet","duurMin":20,"benodigdheden":["ballen"],"technieken":[{"techniek":"service","level":1},{"techniek":"service","level":2},{"techniek":"return","level":1},{"techniek":"return","level":2}],"uitvoering":["Speel gewone games.","Regel: de server moet na elke service naar het net.","De returners kiezen bij elke return bewust: laag cross of lob."],"focus":"Serveerders naar het net, returners maken een keuze.","klaarAls":"Een set tot 4 games"},{"id":"smash-schaduw","naam":"Schaduw-smash","spelers":"solo","duurMin":5,"benodigdheden":[],"technieken":[{"techniek":"smash","level":1}],"uitvoering":["Start aan het net en draai zijwaarts met je vrije hand omhoog.","Zijpassen naar achter, racket achter je rug laten zakken.","Strek je arm naar een denkbeeldige bal en zwaai door. Terug naar het net."],"focus":"Elleboog hoog, arm gestrekt bij het raken.","klaarAls":"10 keer de hele beweging vloeiend"},{"id":"smash-aangooi","naam":"Smash op korte lob","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen","pionnen"],"technieken":[{"techniek":"smash","level":1}],"uitvoering":["Je partner staat achterin en speelt korte lobs.","Jij smasht naar een vak dat je met pionnen hebt aangegeven.","Na elke smash terug naar het net."],"focus":"Alleen smashen als de bal voor je valt.","klaarAls":"6 van 10 in het vak"},{"id":"por-tres","naam":"Smash over de achterwand","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"smash","level":2}],"uitvoering":["Je partner speelt korte, hoge lobs dicht bij het net.","Jij smasht plat en krachtig diep in het vak.","Telt alleen als de bal over de achterwand gaat. Ruim de ballen daarna samen op."],"focus":"Goed onder de bal staan.","klaarAls":"2 van 10 over de achterwand"},{"id":"vibora-aangooi","naam":"Víbora naar de zijwand","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen","pionnen"],"technieken":[{"techniek":"vibora","level":1}],"uitvoering":["Leg een pion bij de zijwand aan de overkant, een meter voor het net.","Je partner speelt halfhoge lobs; jij speelt een víbora richting de pion.","De bal moet stuiten en dan de zijwand raken."],"focus":"Opzij raken, dwars uitzwaaien.","klaarAls":"5 van 10 via de zijwand"},{"id":"overhead-keuze","naam":"Bandeja, víbora of smash","spelers":"kwartet","duurMin":20,"benodigdheden":["ballen"],"technieken":[{"techniek":"bandeja","level":1},{"techniek":"vibora","level":1},{"techniek":"smash","level":1},{"techniek":"smash","level":2}],"uitvoering":["Twee spelers aan het net, twee achterin die alleen lobs spelen in verschillende hoogtes.","De netspeler roept vóór het raken \\"smash\\", \\"víbora\\", \\"bandeja\\", \\"controle\\" of \\"laten\\" (stuiten of wisselen).","Na 5 minuten wisselen."],"focus":"Kies op hoogte en diepte: korte lob smash, halfhoog víbora, diep bandeja, te diep controle of laten.","klaarAls":"8 van 10 keer de juiste keuze, samen beoordeeld"},{"id":"bajada-backhand","naam":"Backhand-bajada","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"bajada","level":2}],"uitvoering":["Je partner speelt hoge, diepe ballen aan je backhandkant, zodat ze hoog van de achterwand komen.","Jij speelt een backhand-bajada en loopt door naar het net."],"focus":"Ver doordraaien, zijwaarts blijven.","klaarAls":"5 van 10 diep terug"},{"id":"zijpas-lijn","naam":"Zijpassen langs de lijn","spelers":"solo","duurMin":5,"benodigdheden":[],"technieken":[{"techniek":"voetenwerk","level":1},{"techniek":"voetenwerk","level":2}],"uitvoering":["Ga in de wachtpositie op de servicelijn staan, bij de zijwand.","Maak zijpassen naar de andere zijwand en weer terug: laag blijven, voeten nooit over elkaar.","Daarna hetzelfde met een openstap en kruispassen, en met zijpassen terug."],"focus":"Laag blijven, borst naar het net.","klaarAls":"5 keer heen en terug zonder rechtop te komen"},{"id":"schaduw-voetenwerk","naam":"Schaduw-voetenwerk","spelers":"solo","duurMin":10,"benodigdheden":[],"technieken":[{"techniek":"voetenwerk","level":1},{"techniek":"forehand","level":2},{"techniek":"backhand","level":2}],"uitvoering":["Start in het midden van je helft met een split-step.","Zijpassen naar je forehandkant, schaduwslag zonder bal, zijpassen terug naar het midden.","Dan naar je backhandkant. Wissel af, 10 keer per kant."],"focus":"Na elke slag terug naar het midden.","klaarAls":"10 keer per kant zonder voeten over elkaar"},{"id":"kegel-tik","naam":"Pionnen tikken","spelers":"duo","duurMin":10,"benodigdheden":["pionnen"],"technieken":[{"techniek":"voetenwerk","level":1},{"techniek":"voetenwerk","level":2},{"techniek":"wachtpositie","level":2}],"uitvoering":["Zet links en rechts van je een pion, op 2 meter en op 4 meter afstand.","Je partner wijst een pion aan precies als hij een slag nadoet. Jij maakt een split-step en tikt de pion aan.","Dichtbij met zijpassen, ver weg met een kruispas. Altijd met zijpassen terug."],"focus":"De juiste pas voor de afstand.","klaarAls":"10 keer achter elkaar de goede pas en op tijd terug"},{"id":"wijde-bal-aangooi","naam":"Wijde ballen","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"voetenwerk","level":1},{"techniek":"voetenwerk","level":2},{"techniek":"forehand","level":2}],"uitvoering":["Je partner gooit afwisselend een bal links en rechts van je, steeds iets verder weg.","Jij haalt de bal met zijpassen of een kruispas, speelt hem rustig terug en gaat terug naar het midden.","Wissel na 10 ballen."],"focus":"Op tijd bij de bal, op ruim een armlengte.","klaarAls":"8 van 10 goed bereikt en terug"},{"id":"dejada-aangooi","naam":"Stopvolley op doel","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen","pionnen of handdoek"],"technieken":[{"techniek":"dejada","level":1}],"uitvoering":["Leg aan de overkant een handdoek of pionnen neer, tot 2 meter achter het net.","Je partner staat achterin en speelt rustige ballen naar je toe.","Jij speelt een stopvolley naar het doelvak. Telt alleen als de bal daar stuit."],"focus":"Losse greep, open blad, bijna niet doorduwen.","klaarAls":"6 van 10 in het vak"},{"id":"servicevak-spel","naam":"Servicevak-padel","spelers":"duo","duurMin":10,"benodigdheden":["ballen"],"technieken":[{"techniek":"dejada","level":1},{"techniek":"volley","level":3},{"techniek":"chiquita","level":1}],"uitvoering":["Speel alleen tussen de servicelijnen, aan weerszijden van het net.","Alle ballen zacht: volleys, stopvolleys en lage ballen. Harde ballen zijn een fout.","Speel punten tot 11."],"focus":"Gevoel en een losse greep.","klaarAls":"Een spel tot 11 gespeeld"},{"id":"midden-spel","naam":"Winnen door het midden","spelers":"kwartet","duurMin":20,"benodigdheden":["ballen"],"technieken":[{"techniek":"midden","level":1}],"uitvoering":["Speel gewone punten.","Een winnende bal door het midden telt dubbel.","Een fout aan de zijkant telt ook dubbel, voor de tegenstander."],"focus":"Laag tussen de twee netspelers door.","klaarAls":"Eerste duo tot 11"},{"id":"middenbal-afspraak","naam":"Middenballen","spelers":"kwartet","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"midden","level":2},{"techniek":"positie","level":2}],"uitvoering":["Twee spelers aan het net, een aangever aan de overkant.","De aangever speelt alle ballen door het midden, snel achter elkaar.","Het netduo roept en houdt zich aan de afspraak: forehand in het midden neemt hem.","Daarna hetzelfde met het duo achterin, met ballen die na de stuit door het midden komen."],"focus":"Roepen voordat je raakt.","klaarAls":"10 middenballen achter elkaar zonder twijfel"},{"id":"chiquita-aangooi","naam":"Chiquita en naar voren","spelers":"duo","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"chiquita","level":1}],"uitvoering":["Je partner staat aan het net, jij achterin.","Speel een zachte, lage bal naar zijn voeten en loop naar voren.","Hij volleyt rustig omhoog terug; jij speelt de volgende bal vanaf het net."],"focus":"Zacht en laag, dan meteen naar voren.","klaarAls":"6 van 10 laag aan de voeten"},{"id":"wissel-training","naam":"Wissel!","spelers":"kwartet","duurMin":15,"benodigdheden":["emmer ballen"],"technieken":[{"techniek":"wisselen","level":1},{"techniek":"bandeja","level":1}],"uitvoering":["Twee spelers aan het net, een aangever achterin aan de overkant.","De aangever speelt lobs, soms haalbaar voor een bandeja, soms te diep.","Het netduo roept \\"ik\\" of \\"wissel\\" en verdedigt samen."],"focus":"Altijd roepen.","klaarAls":"10 lobs achter elkaar goed opgevangen"},{"id":"tactiek-wedstrijd","naam":"Tactiekwedstrijd","spelers":"kwartet","duurMin":30,"benodigdheden":["ballen"],"technieken":[{"techniek":"midden","level":1},{"techniek":"midden","level":2},{"techniek":"chiquita","level":1},{"techniek":"wisselen","level":1},{"techniek":"positie","level":1},{"techniek":"positie","level":2}],"uitvoering":["Speel een gewone wedstrijd.","Kies voor elke game samen één focus: midden, chiquita of wisselen.","Na de game kort bespreken: wat ging goed, wat kan beter?"],"focus":"Eén focus per game.","klaarAls":"Een set gespeeld met elke game een focus"}]`),E=[{naam:`Je eerste rally`,uitleg:`Hierna kun je een rustige rally spelen en een punt beginnen.`,stappen:[`greep:1`,`wachtpositie:1`,`forehand:1`,`backhand:1`,`volley:1`,`service:1`],knltb:`9 → 8`},{naam:`Je eerste wedstrijd`,uitleg:`Op tijd bewegen, goed staan als duo en de eerste ballen van de wand: genoeg voor een echte wedstrijd.`,stappen:[`wachtpositie:2`,`positie:1`,`achterwand:1`,`lob:1`,`voetenwerk:1`],knltb:`8`},{naam:`Het net veroveren`,uitleg:`Slaan in beweging, de return, de bandeja en samen naar voren: hier win je je eerste punten aan het net.`,stappen:[`forehand:2`,`backhand:2`,`volley:2`,`return:1`,`bandeja:1`,`positie:2`,`midden:1`],knltb:`8 → 7`},{naam:`Solide spelen`,uitleg:`Minder fouten, meer keuzes: de lob en het wandspel aan beide kanten, de smash en vaste afspraken met je partner.`,stappen:[`achterwand:2`,`lob:2`,`volley:3`,`service:2`,`smash:1`,`return:2`,`zijwand:1`,`wisselen:1`,`midden:2`,`bandeja:2`],knltb:`7`},{naam:`Verfijnen en aanvallen`,uitleg:`Richting, gevoel en de aanvallende slagen: hier maak je het verschil.`,stappen:[`voetenwerk:2`,`forehand:3`,`backhand:3`,`dejada:1`,`lob:3`,`chiquita:1`,`zijwand:2`,`vibora:1`,`bajada:1`,`dubbele-wand:1`,`dubbele-wand:2`,`bajada:2`,`smash:2`],knltb:`6`}],D=JSON.parse(`[{"id":"app","titel":"Over de app","kort":"Hoe je de app gebruikt en waarom hij er is","secties":[{"kop":"Volg je volgende stap","tekst":["Op het beginscherm staat steeds je volgende stap uit het leerpad. Het leerpad zet alle technieken in een volgorde waarin elke stap voortbouwt op de vorige.","Wil je iets anders oefenen? Dat mag. Bij elke techniek zie je wat je eerst moet beheersen, met een vinkje als je dat al kunt."]},{"kop":"Per level","stappen":[["Kijk","Speel de animatie af op 0,25× en sleep over het beeld om rond te draaien. Kies bovenin het aanzicht dat het meest laat zien."],["Lees","Onder de animatie loopt de uitleg van elke fase mee. Pauzeer en blader met de pijltjes fase voor fase."],["Vergelijk","Tik bij \\"Veelgemaakte fouten\\" op een fout en je ziet fout naast goed. Dit zijn de dingen waar je op let als je jezelf filmt."],["Oefen","Onderaan staan de oefeningen voor dit level. Zet ze in je training met het plusje."],["Meet","Bij \\"Beheerst als\\" staat het criterium, meestal in twee stappen: eerst in de oefening, daarna in het spel. In de oefening weet je welke slag komt; in het spel moet je hem zelf herkennen. Lukt het allebei? Tik op Check! en de volgende stap verschijnt.","Bij elk doel van het leerpad staat bij welk KNLTB-niveau de slagen ongeveer passen. Dat is een indicatie: je echte KNLTB-niveau volgt uit je uitslagen."]]},{"kop":"Instellingen","lijst":["Rechts- of linkshandig: alle beelden en teksten draaien mee.","Links of rechts op de baan kies je per techniek, boven de levels.","Met de voortgangscode in Instellingen zet je je voortgang over naar een ander toestel."]},{"kop":"Zet de app op je beginscherm","lijst":["iPhone (Safari): tik op het deelicoon, het vierkantje met de pijl omhoog, en kies \\"Zet op beginscherm\\".","Android (Chrome): tik op de drie puntjes en kies \\"App installeren\\" of \\"Toevoegen aan startscherm\\".","Daarna opent de app schermvullend, net als een gewone app, en werkt hij ook zonder internet."],"stijl":"tip"},{"kop":"Waarom deze app","tekst":["Hoi, ik ben Merijn! Door de week help ik als de Verbeterdokter organisaties om hun processen stap voor stap beter te maken. Verbeteren zit gewoon in mijn kern, en dat houdt niet op zodra ik mijn laptop dichtklap.","Dus ook op de padelbaan wil ik elke keer een beetje beter worden. En eerlijk: het is er precies hetzelfde als in een proces. Zonder een goede basis die bestaat uit heldere stappen blijf je repareren in plaats van groeien. Daarom bouwde ik deze app voor mezelf en mijn padelmaatjes: techniek voor techniek en stap voor stap bouwen aan een stabiel fundament voor een betere output.","Maak ik er onderweg ook anderen blij mee, dan is dat een mooie bonus. Veel plezier met oefenen!"],"link":["Nieuwsgierig wat ik doordeweeks doe?","deverbeterdokter.nl","https://www.deverbeterdokter.nl"]},{"kop":"Je gegevens","tekst":["Geen account, geen reclame en geen tracking. De app stuurt geen gegevens naar mij of naar anderen.","Je voortgang en instellingen staan alleen in de browser op je eigen telefoon. Wis je de browsergegevens, dan is je voortgang weg. Bewaar daarom je voortgangscode uit Instellingen.","Tik je op een link naar YouTube, dan verlaat je de app en gelden de regels van YouTube."],"stijl":"klein"}]},{"id":"regels","titel":"Spelregels en telling","kort":"De belangrijkste regels, kort en duidelijk","secties":[{"kop":"Telling","lijst":["Punten tellen zoals bij tennis: 15, 30, 40, game.","Bij 40-40 spreek je vooraf af hoe je verder speelt. Met voordeel: twee punten verschil. Met een gouden punt: wie het volgende punt maakt, wint de game; het ontvangende duo kiest wie de bal ontvangt. Met de Star Point (sinds 2026 in het profcircuit): de eerste twee keer 40-40 speel je met voordeel, de derde keer beslist één punt.","Een set gaat tot 6 games, met 2 games verschil. Bij 6-6 speel je een tiebreak tot 7 punten, ook met 2 punten verschil.","Een wedstrijd is meestal best of three: wie het eerst 2 sets wint.","Na elke oneven game (1, 3, 5 …) wissel je van kant."]},{"kop":"Service","lijst":["Je serveert onderhands: laat de bal achter de servicelijn stuiten en raak hem op of onder je middel.","Je staat stil achter de servicelijn, met minstens één voet aan de grond, en raakt de bal achter de lijn. Op de lijn stappen of lopen is een voetfout. Sta je met beide voeten achter de lijn, dan zit je altijd goed.","De bal moet schuin over het net in het servicevak aan de overkant stuiten. Daarna mag hij het glas raken, maar niet het hek (gaas).","Je hebt twee kansen. Raakt de bal het net en komt hij goed in het vak, dan is het een let: overdoen. Raakt hij daarna het hek, dan is hij fout.","Je begint rechts en wisselt na elk punt van kant. Eén speler serveert een hele game; daarna serveert het andere duo, en de volgende keer je partner.","Wie de bal ontvangt, moet de service eerst laten stuiten."]},{"kop":"Tijdens de rally","lijst":["De bal mag aan jouw kant maar één keer stuiten. Na die stuit mag hij tegen het glas of het hek komen, en dan speel je hem alsnog terug.","Je mag ook volleyen, behalve bij de return.","Je slag moet eerst op de grond aan de overkant komen. Raakt je bal meteen het glas of het hek van de tegenstander, dan verlies je het punt.","Je mag de bal via je eigen glas over het net spelen (contrapared), zolang hij aan jouw kant niet opnieuw de grond raakt.","Je verliest het punt als de bal jou of je partner raakt, als je het net aanraakt met je lichaam of racket, of als de bal twee keer stuit.","Raakt de bal in de rally het net en gaat hij erover, dan speel je gewoon door.","Gaat de bal na de stuit aan jouw kant via een opening de baan uit, dan mag je hem op sommige banen buiten nog terugspelen. Spreek dit vooraf af."]}]},{"id":"begrippen","titel":"Begrippen","kort":"Padeltaal, ook de Spaanse woorden","secties":[{"begrippen":[["Achterwand","Het glas achter je. Een bal die na de stuit van de achterwand komt, speel je gewoon terug."],["Bajada","Een hoge bal die van de achterwand terugkomt, aanvallend naar beneden spelen. Voluit: bajada de pared."],["Bandeja","Verdedigende smash met slice vanaf het net. Doel: het net houden, niet scoren."],["Chiquita","Zachte, lage bal naar de voeten van de netspelers, zodat jullie zelf naar voren kunnen."],["Continentale greep","De greep voor bijna alle slagen, ook hamergreep genoemd. De V tussen duim en wijsvinger ligt bovenop de greep."],["Contrapared","Je speelt de bal tegen je eigen wand, waarna hij over het net gaat. Een noodslag."],["Cross","Schuin over de baan, naar de diagonaal tegenover je."],["Dejada","Stopbal of stopvolley: zacht en kort net over het net."],["Drive en revés","De vaste kanten van een duo: de drive speelt rechts, de revés links. Bij twee rechtshandigen neemt de revés meestal de middenballen met zijn forehand."],["Dubbele wand","Een bal die twee wanden raakt, meestal eerst de achterwand en dan de zijwand. Spaans: doble pared."],["Globo","Spaans voor lob."],["Gouden punt","Beslissend punt bij 40-40: wie het wint, wint de game. Spaans: punto de oro."],["Star Point","Telling bij 40-40 die sinds 2026 in het profcircuit wordt gespeeld: twee keer met voordeel, bij de derde keer 40-40 beslist één punt."],["Hek","Het gaas (malla) naast en achter het glas. Na de stuit mag de bal het hek raken; de stuit is daarna minder voorspelbaar."],["Kruispas","Pas waarbij je achterste voet vóór de andere langs gaat, om een verre bal te halen."],["Langs de lijn","Recht vooruit, langs de zijwand. Spaans: paralelo."],["Let","Service die het net raakt en goed in het vak valt. Je mag hem overdoen."],["Lob","Hoge bal over de netspelers heen, diep in de laatste 2 meter voor hun achterwand."],["Por tres","Smash die zo hoog opstuit dat hij over de achterwand de baan uit gaat."],["Por cuatro","Smash die via de zijkant, door de opening of over het zijhek, de baan uit gaat."],["Remate","Spaans voor smash."],["Rulo","Smash met topspin: de bal springt na de stuit hard door. Voor gevorderden."],["Salida","Een bal buiten de baan nog terugspelen, als die via een opening de baan uit is gegaan."],["Servicelijn","De lijn op bijna 7 meter van het net. Achter deze lijn sta je bij de service."],["Split-step","Klein sprongetje op het moment dat de tegenstander raakt, zodat je meteen alle kanten op kunt."],["T","Het punt waar de middenlijn de servicelijn raakt."],["Víbora","Aanvallende smash met veel zijwaartse slice, meestal naar de zijwand van de tegenstander."],["Volley","Een bal uit de lucht spelen, zonder dat hij eerst stuit. Spaans: volea."],["Wachtpositie","Klaarstaan met racket voor je borst, door de knieën, gewicht op je voorvoeten."],["Zijpas","Opzij bewegen zonder de voeten te kruisen, borst naar het net."],["Zijwand","Het glas aan de zijkant. Een bal van de zijwand verandert van richting en komt naar het midden."]]}]},{"id":"warming-up","titel":"Warming-up","kort":"Acht minuten om blessurevrij te beginnen","secties":[{"tekst":["Padel vraagt veel van je kuiten, schouders, ellebogen en onderrug. Een korte warming-up voorkomt de meeste blessures en je speelt meteen beter."]},{"kop":"Zo doe je het","stappen":[["Losmaken · 2 min","Rustig joggen langs de baan, daarna zijpassen, kruispassen en een stukje achteruit lopen."],["Mobiliseren · 2 min","Armcirkels voor- en achterwaarts, polsen draaien, romp draaien met het racket in beide handen, heupcirkels, benen zwaaien voor-achter en opzij."],["Activeren · 1 min","10 squats, 10 uitvalspassen met een draai van je romp, 10 split-steps."],["Ballen · 3 min","Begin zacht tussen de servicelijnen met volleys, ga dan naar achteren voor rustige forehands en backhands, een paar lobs en bandeja's, en sluit af met een paar services."]]},{"kop":"Let op","lijst":["Smash pas hard als je goed warm bent.","Houd je greep los, zeker in het begin: dat spaart je elleboog.","Voel je je kuit of achillespees? Doe dan rustig aan met sprinten en springen."]}]},{"id":"aangooien","titel":"Goed aangooien","kort":"Voor de partner die de ballen aangeeft","secties":[{"tekst":["Bij veel oefeningen geeft je partner de ballen aan. Een goede aangooi is het halve werk: hoe vaker dezelfde bal komt, hoe sneller de techniek erin zit."]},{"kop":"De basis","lijst":["Sta aan de overkant, 1 tot 2 meter achter het net, schuin tegenover je partner.","Gooi onderhands met een boog, zodat de bal één keer stuit en op heuphoogte bij je partner komt.","Steeds dezelfde bal. Pas als 8 van de 10 goed gaan, maak je het moeilijker.","Gooi pas als je partner terug is in de wachtpositie."]},{"kop":"Per soort oefening","lijst":["Grondslagen: onderhands gooien, stuit op ongeveer 2 meter voor je partner.","Volley: vanaf de achterlijn met het racket rustig aanspelen, op borsthoogte.","Bandeja en smash: vanaf achterin met het racket lobben. Korte lob voor de smash, diepere voor de bandeja.","Wandspel: gooi hard en diep, zodat de bal stuit en tegen het glas gaat."]},{"kop":"Moeilijker maken, stap voor stap","lijst":["Eerst steeds op dezelfde plek.","Dan een meter opzij, om en om links en rechts.","Dan wisselend in hoogte en diepte.","Pas daarna met tempo."]},{"kop":"Ook coach zijn","lijst":["Kies één punt uit de app om op te letten, bijvoorbeeld het raakpunt.","Geef één tip per keer, niet vijf tegelijk.","Tel je pogingen hardop mee, of laat je partner tellen."]},{"kop":"Veilig","lijst":["Nooit gooien terwijl je partner nog in zijn slag zit.","Houd losse ballen weg van de voeten.","Bij smash-oefeningen: sta achterin en uit de lijn van de smash."]}]},{"id":"filmen","titel":"Jezelf filmen","kort":"De snelste manier om je eigen techniek te zien","secties":[{"tekst":["Wat je voelt en wat je doet, is vaak niet hetzelfde. Een filmpje van tien seconden laat precies zien waar het misgaat."]},{"kop":"Zo film je","stappen":[["Telefoon neerzetten","Zet je telefoon tegen een tas of een fles op 3 tot 4 meter afstand, ongeveer op heuphoogte. Bij elk level staat welk standpunt het beste werkt."],["Slow motion","Gebruik de slow-motionstand van je camera als je die hebt."],["Kort filmen","Film 5 tot 10 slagen achter elkaar, niet een hele training."],["Vergelijken","Zet in de app de animatie in hetzelfde aanzicht op 0,25× en vergelijk ze naast elkaar."],["Eén punt","Kijk naar één controlepunt per keer. Pas als dat goed gaat, kijk je naar het volgende."]]},{"kop":"Tip","tekst":["Voor positiespel film je van buiten de baan, achter het glas en zo hoog mogelijk. Dan zie je alle vier de spelers en de ruimtes ertussen."]}]}]`),O=S,k=C.sort((e,t)=>e.volgorde-t.volgorde),A=w,j=T,M=e=>k.find(t=>t.id===e),ee=e=>j.find(t=>t.id===e),te=e=>k.filter(t=>t.categorie===e),ne=e=>te(e).reduce((e,t)=>e+t.levels.length,0),re=e=>(e==null?[]:e).flatMap(e=>{let[t,n]=e.split(`:`),r=M(t);return r?[{techniek:r,level:n?Number(n):1}]:[]}),N=e=>e.techniek.levels.length>1?`${e.techniek.naam} L${e.level}`:e.techniek.naam,P=E,F=P.flatMap((e,t)=>e.stappen.map(e=>{let[n,r]=e.split(`:`);return{sleutel:e,techniek:M(n),level:Number(r),etappe:t,nr:0}})).filter(e=>e.techniek).map((e,t)=>({...e,nr:t+1})),ie=e=>e.techniek.levels.find(t=>t.level===e.level),I=D,ae=e=>I.find(t=>t.id===e);function L(e,t){let n=t===`rechts`?`linker`:`rechter`,r=t===`rechts`?`rechter`:`linker`,i=e.replace(/\{linker\}/g,n).replace(/\{rechter\}/g,r).replace(/\{links\}/g,t===`rechts`?`links`:`rechts`).replace(/\{rechts\}/g,t===`rechts`?`rechts`:`links`);return i.charAt(0).toUpperCase()+i.slice(1)}var oe={solo:`Solo`,duo:`Duo`,kwartet:`Kwartet`},se=[[`accent`,`M2291.79,1595.54c85.26-13.45,101.41,111.69,23,123-85.66,12.35-98.02-111.16-23-123Z`],[`accent`,`M2260.65,1009.54c-.07,1.17-.18,2.35-.34,3.52.15-.05.3-.09.45-.14,63.17-19.73,122.7-56.93,165.55-105.86l2.02-54.98c3.78-61.79,4.52-123.82,4.56-185.91v-1.02c.02-35.27-.19-70.55-.21-105.81v-.56c-.01-28.06.1-56.1.56-84.11.04-2.56.08-5.11.13-7.67-4.1-11.25-12.35-16.63-24.05-17.95-28.45-3.18-93.07-2.63-122.09-.07-17.57,1.55-25.45,9.45-27,27-8.42,95.44-2.52,66.65-2.02,298.18-2.32,79.9-2.38,128.3-.41,189.69.12,
